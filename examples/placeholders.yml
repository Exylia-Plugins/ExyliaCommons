  ---
  ★ Insight ─────────────────────────────────────
- _* al final del nombre indica automáticamente que acepta argumentos (o usa hasArgument = true)
- El argumento se inyecta en el primer parámetro String que no sea Player/Context
- MAX_NESTING_DEPTH = 10 previene loops infinitos en placeholders que se referencian mutuamente
- El procesamiento async usa thenCompose para encadenar las pasadas recursivamente
