templates:
  player-join:
    url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    content: "Un jugador se ha unido al servidor!"
    username: "Server Bot"
    avatar_url: "https://example.com/avatar.png"
    embeds:
      1:
        title: "Nuevo Jugador"
        description: "%player_name% se ha conectado"
        color: "#00FF00"
        timestamp: "%timestamp%"
        thumbnail:
          url: "https://mc-heads.net/avatar/%player_name%/100"
        fields:
          1:
            name: "Jugador"
            value: "%player_name%"
            inline: true
          2:
            name: "IP"
            value: "%player_ip%"
            inline: true
        footer:
          text: "Server Notification"
          icon_url: "https://example.com/icon.png"

  purchase:
    url: "https://discord.com/api/webhooks/ECONOMY_WEBHOOK_ID/ECONOMY_WEBHOOK_TOKEN"
    embeds:
      1:
        title: "Nueva Compra"
        description: "%player_name% ha comprado %item_name%"
        color: "#FFD700"
        author:
          name: "%player_name%"
          icon_url: "https://mc-heads.net/avatar/%player_name%/64"
        fields:
          1:
            name: "Item"
            value: "%item_name%"
            inline: true
          2:
            name: "Precio"
            value: "$%price%"
            inline: true
          3:
            name: "Balance"
            value: "$%balance%"
            inline: true
        footer:
          text: "Economy System"

  error-report:
    url: "https://discord.com/api/webhooks/ERRORS_WEBHOOK_ID/ERRORS_WEBHOOK_TOKEN"
    username: "Error Reporter"
    embeds:
      1:
        title: "Error Detectado"
        description: "```%error_message%```"
        color: "#FF0000"
        timestamp: "%timestamp%"
        fields:
          1:
            name: "Tipo"
            value: "%error_type%"
            inline: true
          2:
            name: "Módulo"
            value: "%module%"
            inline: true
