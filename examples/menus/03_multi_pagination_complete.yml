      # lore_prepend: Se AÑADE al inicio del lore
      # lore_replace: REEMPLAZA todo el lore
    items: []
    navigation:
      previous:
        slot: 9
        material: ARROW
        name: '&e&l← Armas Anteriores'
        lore:
          - '&7Navega las armas'
          - ''
          - '&7Página: &e%section_page%/%section_total_pages%'
        actions:
          - 'previous_page'
        click_sounds:
          - 'UI_BUTTON_CLICK'
      next:
        slot: 13
        material: ARROW
        name: '&e&lSiguientes Armas →'
        lore:
          - '&7Navega las armas'
          - ''
          - '&7Página: &e%section_page%/%section_total_pages%'
        actions:
          - 'next_page'
