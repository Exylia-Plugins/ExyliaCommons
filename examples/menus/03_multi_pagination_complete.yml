        lore:
          - '&7Página: &e%section_page%/%section_total_pages%'
          - '&7Total armaduras: &e%section_total_items%'

items: []

# Por sección:
#   %section_name%         - Nombre de la sección
#   %section_page%         - Página actual de la sección
#   %section_total_pages%  - Total páginas de la sección
#   %section_total_items%  - Total items de la sección
#   %selected_index%       - Índice del item seleccionado (-1 si ninguno)
#   %index%                - Índice del item actual