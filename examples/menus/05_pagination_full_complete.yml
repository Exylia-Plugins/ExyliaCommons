# ==================================================
# EJEMPLO COMPLETO: PAGINATION FULL MENU
# ==================================================
# Combina PAGINATION + FULL_INVENTORY
# Paginación de items + acceso al inventario del jugador
# Útil para bancos, almacenes, etc.
# ==================================================

title: '&6&lBanco Personal &8| &ePág. %current_page%/%total_pages%'
type: PAGINATION_FULL
size: 54

# --------------------------------------------------
# SNAPSHOT: Guardar/restaurar inventario
# --------------------------------------------------
snapshot:
  enabled: true
  restore_on_close: true
  snapshot_id: 'bank_menu'

# --------------------------------------------------
# PLAYER INVENTORY: Acceso al inventario
# --------------------------------------------------
player_inventory:
  enabled: true
  allowed_slots: '0-35'  # Todo el inventario del jugador

# --------------------------------------------------
# REFRESH
# --------------------------------------------------
refresh:
  mode: SMART
  interval: 40

# --------------------------------------------------
# FILLER
# --------------------------------------------------
filler:
  border:
    material: YELLOW_STAINED_GLASS_PANE
    name: ' '

# --------------------------------------------------
# PAGINATION: Items del banco (se paginan)
# --------------------------------------------------
pagination:
  # Slots para items del banco (primera mitad del menú)
  slots: '0-26'  # 27 slots (3 filas superiores)

  # Items del banco (se generarían dinámicamente en tu plugin)
  # Aquí hay ejemplos estáticos para demostración
  items:
    - material: CHEST
      name: '&eSlot del Banco &7#%index%'
      lore:
        - '&7Este es un slot de almacenamiento'
        - '&7del banco personal'
        - ''
        - '&7Slot: &e%index%'
        - '&7Página: &e%current_page%/%total_pages%'
        - ''
        - '&7Arrastra items aquí para'
        - '&7guardarlos en el banco'
      actions:
        - 'message: &7Slot del banco #%index%'

    - material: ENDER_CHEST
      name: '&dSlot Premium &7#%index%'
      lore:
        - '&7Slot de almacenamiento premium'
        - ''
        - '&d✦ Protegido contra robo'
        - '&d✦ Acceso desde cualquier lugar'
      glowing: true
      actions:
        - 'message: &dSlot premium #%index%'

    # Repite para generar más slots...
    # En tu implementación, estos vendrían de una DB
    # o sistema de almacenamiento

  # Navegación de páginas del banco
  navigation:
    previous:
      slot: 45
      material: ARROW
      name: '&e&l← Página Anterior'
      lore:
        - '&7Navega a la página anterior'
        - '&7del banco'
        - ''
        - '&7Página: &e%current_page%/%total_pages%'
      actions:
        - 'previous_page'
      click_sounds:
        - 'UI_BUTTON_CLICK'

    next:
      slot: 53
      material: ARROW
      name: '&e&lPágina Siguiente →'
      lore:
        - '&7Navega a la siguiente página'
        - '&7del banco'
        - ''
        - '&7Página: &e%current_page%/%total_pages%'
      actions:
        - 'next_page'
      click_sounds:
        - 'UI_BUTTON_CLICK'

    info:
      slot: 49
      material: PAPER
      name: '&7&lInformación del Banco'
      lore:
        - '&7Página: &e%current_page% &7de &e%total_pages%'
        - '&7Slots totales: &e%total_items%'
        - '&7Capacidad: &e{bank_capacity}'
        - ''
        - '&7Items guardados: &e{stored_items_count}'
        - '&7Slots libres: &e{free_slots}'
        - ''
        - '&7Última transacción:'
        - '&e{last_transaction}'
      dynamic_update: true
      update_interval: 20

# --------------------------------------------------
# ITEMS FIJOS
# --------------------------------------------------
items:
  # ============================================
  # SEPARADORES
  # ============================================
  separator:
    material: CYAN_STAINED_GLASS_PANE
    name: '&3━━━━━━━━━━━━━━━'
    slots: [27, 28, 29, 30, 31, 32, 33, 34, 35]  # Fila separadora

  # ============================================
  # DEPOSIT ALL: Depositar todo
  # ============================================
  deposit_all:
    material: LIME_DYE
    name: '&a&lDepositar Todo'
    lore:
      - '&7Mueve TODOS los items'
      - '&7de tu inventario al banco'
      - ''
      - '&7Items que se depositarán:'
      - '&e• Herramientas'
      - '&e• Bloques'
      - '&e• Items'
      - ''
      - '&cNo deposita: Armadura equipada'
      - ''
      - '&e▸ Click para depositar todo'
    slot: 46
    actions:
      # Acción custom que implementarías
      - 'message: &a¡Todos los items depositados!'
      - 'sound: ENTITY_EXPERIENCE_ORB_PICKUP'
    click_sounds:
      - 'BLOCK_CHEST_OPEN'

  # ============================================
  # WITHDRAW ALL: Retirar todo
  # ============================================
  withdraw_all:
    material: RED_DYE
    name: '&c&lRetirar Todo'
    lore:
      - '&7Mueve TODOS los items'
      - '&7del banco a tu inventario'
      - ''
      - '&c¡Asegúrate de tener espacio!'
      - ''
      - '&7Si no hay espacio, los items'
      - '&7se quedarán en el banco'
      - ''
      - '&e▸ Click para retirar todo'
    slot: 52
    actions:
      - 'message: &c¡Todos los items retirados!'
      - 'sound: BLOCK_CHEST_CLOSE'
    click_sounds:
      - 'BLOCK_CHEST_OPEN'

  # ============================================
  # QUICK DEPOSIT: Depósito rápido
  # ============================================
  quick_deposit:
    material: HOPPER
    name: '&6&lDepósito Rápido'
    lore:
      - '&7Deposita el item que'
      - '&7tienes en la mano'
      - ''
      - '&e▸ Click con item en mano'
    slot: 47
    actions:
      - 'message: &aItem depositado'

  # ============================================
  # SORT: Ordenar banco
  # ============================================
  sort_bank:
    material: COMPARATOR
    name: '&e&lOrdenar Banco'
    lore:
      - '&7Organiza automáticamente'
      - '&7los items del banco'
      - ''
      - '&7Agrupa items similares'
      - '&7y optimiza el espacio'
      - ''
      - '&e▸ Click para ordenar'
    slot: 48
    actions:
      - 'message: &aBanco ordenado'
      - 'sound: ITEM_BOOK_PAGE_TURN'

  # ============================================
  # SEARCH: Buscar item
  # ============================================
  search:
    material: COMPASS
    name: '&b&lBuscar Item'
    lore:
      - '&7Busca un item específico'
      - '&7en todo el banco'
      - ''
      - '&7Escribe el nombre en el chat'
      - ''
      - '&e▸ Click para buscar'
    slot: 50
    actions:
      - 'message: &bEscribe el nombre del item en el chat'

  # ============================================
  # UPGRADE: Mejorar banco
  # ============================================
  upgrade:
    material: NETHER_STAR
    name: '&d&lMejorar Banco'
    lore:
      - '&7Nivel actual: &e{bank_level}'
      - '&7Capacidad: &e{bank_capacity} slots'
      - ''
      - '&7Siguiente nivel:'
      - '&e• Capacidad: +27 slots'
      - '&e• Costo: $10,000'
      - ''
      - '&d▸ Click para mejorar'
    slot: 51
    glowing: true
    actions:
      - 'message: &d¡Banco mejorado!'
      - 'sound: ENTITY_PLAYER_LEVELUP'

  # ============================================
  # PLAYER INFO: Info del jugador
  # ============================================
  player_info:
    material: PLAYER_HEAD
    skull: '%player_name%'
    name: '&e%player_name%'
    lore:
      - '&7Nivel del banco: &e{bank_level}'
      - '&7Slots totales: &e{bank_capacity}'
      - '&7Items guardados: &e{stored_items}'
      - ''
      - '&7Balance: &a${balance}'
      - ''
      - '&7Página: &e%current_page%/%total_pages%'
    slot: 4
    dynamic_update: true
    update_interval: 20

  # ============================================
  # CLOSE: Cerrar
  # ============================================
  close:
    material: BARRIER
    name: '&c&lCerrar'
    lore:
      - '&7Cierra el banco'
      - ''
      - '&7Tu inventario será restaurado'
      - '&7al estado original'
    slot: 44
    actions:
      - 'close'

# --------------------------------------------------
# CÓMO FUNCIONA:
# --------------------------------------------------
# 1. Slots 0-26: Items del BANCO (paginados)
#    - El jugador puede mover items aquí
#    - Se guardan en una base de datos
#    - Se paginan automáticamente
#
# 2. Slots 27-35: Separador visual
#    - No interactivos
#
# 3. Slots 36+: Botones de control
#    - Depositar/retirar todo
#    - Ordenar, buscar, mejorar
#
# 4. Inventario del jugador (0-35):
#    - El jugador puede mover items
#    - Arrastra items entre inventario y banco
#    - Snapshot protege contra pérdidas
#
# 5. Navegación:
#    - Previous/Next cambian la página del banco
#    - Cada página muestra 27 slots diferentes
#    - Los items del jugador siempre visibles
#
# --------------------------------------------------
# USO TÍPICO:
# --------------------------------------------------
# 1. Jugador abre el banco
# 2. Ve su inventario abajo
# 3. Ve slots del banco arriba (página 1)
# 4. Arrastra items del inventario al banco
# 5. Usa botones para depositar/retirar todo
# 6. Navega páginas para ver más slots
# 7. Cierra - su inventario se restaura
#
# IMPORTANTE: Los items guardados en el banco
# deben persistir en una base de datos o archivo
