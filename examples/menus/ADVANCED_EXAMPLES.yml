# ================================================
# EJEMPLO 9: MINIMAPA INTERACTIVO
# ================================================

minimap:
  title: '&6Mapa del Servidor'
  type: SIMPLE
  size: 54

  items:
    # Grid del mapa (9x6)
    # Cada slot representa una zona
    zone_spawn:
      material: GRASS_BLOCK
      name: '&aSpawn'
      lore:
        - '&7Jugadores: &e{players_spawn}'
        - ''
        - '&e▸ Click para teleportar'
      slot: 22
      actions:
        - 'command: spawn'

    zone_pvp:
      material: NETHERRACK
      name: '&cArena PvP'
      lore:
        - '&7Jugadores: &e{players_pvp}'
        - '&7En combate: &c{pvp_active}'
      slot: 13
      actions:
        - 'command: warp pvp'

    zone_mine:
      material: STONE
      name: '&7Minas'
      lore:
        - '&7Jugadores: &e{players_mine}'
      slot: 31
      actions:
        - 'command: warp mine'

    # Más zonas...

# ================================================
# EJEMPLO 10: QUEST / MISIONES TRACKER
# ================================================

quest_tracker:
  title: '&6&lMis Misiones'
  type: PAGINATION
  size: 54

  refresh:
    mode: SMART
    interval: 20

  pagination:
    slots: '10-16,19-25,28-34'

    items:
      - material: WRITABLE_BOOK
        name: '&e{quest_%index%_name}'
        lore:
          - '&7Estado: &a{quest_%index%_status}'
          - ''
          - '&7Progreso:'
          - '&a▓▓▓&7░░ &f{quest_%index%_progress}%'
          - ''
          - '&7Objetivos:'
          - '&7• {quest_%index%_obj1} &a✓'
          - '&7• {quest_%index%_obj2} &c✗'
          - '&7• {quest_%index%_obj3} &e◐'
          - ''
          - '&7Recompensa:'
          - '&6• {quest_%index%_reward}'
          - ''
          - '&e▸ Click para más info'
        dynamic_update: true
        actions:
          - 'message: &eMostrando detalles de {quest_%index%_name}'

  items:
    daily:
      material: CLOCK
      name: '&6&lMisiones Diarias'
      lore:
        - '&7Completadas hoy: &a{daily_completed}/{daily_total}'
        - '&7Tiempo restante: &e{daily_reset}'
      slot: 45
      dynamic_update: true

    weekly:
      material: COMPASS
      name: '&b&lMisiones Semanales'
      lore:
        - '&7Completadas: &a{weekly_completed}/{weekly_total}'
      slot: 46
      dynamic_update: true

