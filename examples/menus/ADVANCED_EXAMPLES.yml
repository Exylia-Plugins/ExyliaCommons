# ================================================
# EJEMPLO 2: CONFIRMACIÓN DE ACCIÓN
# ================================================

confirmation_menu:
  title: '&c&l⚠ CONFIRMACIÓN'
  type: SIMPLE
  size: 27

  filler:
    global:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '

  items:
    # Item a eliminar/confirmar
    confirm_item:
      material: TNT
      name: '&c&l¿Eliminar este item?'
      lore:
        - '&7Esta acción es irreversible'
        - ''
        - '&c¡Se perderá para siempre!'
      slot: 13
      glowing: true
      enchantments:
        DURABILITY: 10

    # Botón CONFIRMAR
    yes:
      material: LIME_WOOL
      name: '&a&l✓ SÍ, CONFIRMAR'
      lore:
        - '&7Click para confirmar'
        - '&7la acción'
      slots: [11, 12]
      actions:
        - 'message: &a¡Acción confirmada!'
        - 'sound: ENTITY_PLAYER_LEVELUP'
        # Aquí ejecutar la acción real
        - 'close'
      click_sounds:
        - 'BLOCK_NOTE_BLOCK_PLING'

    # Botón CANCELAR
    no:
      material: RED_WOOL
      name: '&c&l✗ NO, CANCELAR'
      lore:
        - '&7Click para cancelar'
        - '&7y volver'
      slots: [14, 15]
      actions:
        - 'message: &cAcción cancelada'
        - 'sound: BLOCK_NOTE_BLOCK_BASS'
        - 'back'

# ================================================
# EJEMPLO 3: SELECTOR DE COLOR
# ================================================

color_selector:
  title: '&6Selector de Color'
  type: SIMPLE
  size: 27

  items:
    red:
      material: RED_WOOL
      name: '&c&lRojo'
      lore:
        - '&7Click para seleccionar'
        - '&7color rojo'
      slot: 10
      actions:
        - 'select: red'
        - 'message: &cColor: ROJO'

    orange:
      material: ORANGE_WOOL
      name: '&6&lNaranja'
      slot: 11
      actions:
        - 'select: orange'

    yellow:
      material: YELLOW_WOOL
      name: '&e&lAmarillo'
      slot: 12
      actions:
        - 'select: yellow'

    lime:
      material: LIME_WOOL
      name: '&a&lVerde Lima'
      slot: 13
      actions:
        - 'select: lime'

    green:
      material: GREEN_WOOL
      name: '&2&lVerde'
      slot: 14
      actions:
        - 'select: green'

    cyan:
      material: CYAN_WOOL
      name: '&3&lCian'
      slot: 15
      actions:
        - 'select: cyan'

    blue:
      material: BLUE_WOOL
      name: '&9&lAzul'
      slot: 16
      actions:
        - 'select: blue'

    # Preview del color seleccionado
    preview:
      material: WHITE_WOOL
      name: '&f&lColor Seleccionado'
      lore:
        - '&7Color actual: &f{selected_color}'
        - ''
        - '&7Este item cambiaría'
        - '&7según el color seleccionado'
      slot: 22
      dynamic_update: true

# ================================================
