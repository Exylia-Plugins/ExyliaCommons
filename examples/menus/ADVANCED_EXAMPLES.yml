# ================================================
# EJEMPLO 5: RANKING / LEADERBOARD
# ================================================

leaderboard:
  title: '&6&lTOP 10 JUGADORES'
  type: PAGINATION
  size: 54

  pagination:
    slots: '10-16,19-25,28-34'

    items:
      # Este sería generado dinámicamente desde tu DB
      - material: PLAYER_HEAD
        skull: '{player_%index%}'  # Placeholder dinámico
        name: '&e#{rank} &f{player_%index%}'
        lore:
          - '&7Kills: &c{kills_%index%}'
          - '&7Deaths: &7{deaths_%index%}'
          - '&7K/D: &e{kd_%index%}'
          - '&7Nivel: &a{level_%index%}'
          - ''
          - '&e▸ Click para ver perfil'
        actions:
          - 'message: &aAbriendo perfil de {player_%index%}'

    navigation:
      previous:
        slot: 48
        material: ARROW
        name: '&e← Top Anterior'
      next:
        slot: 50
        material: ARROW
        name: '&eTop Siguiente →'

  items:
    your_rank:
      material: PLAYER_HEAD
      skull: '%player_name%'
      name: '&aTu Posición'
      lore:
        - '&7Posición: &e#{your_rank}'
        - '&7Kills: &c{your_kills}'
        - '&7Deaths: &7{your_deaths}'
        - '&7K/D: &e{your_kd}'
      slot: 4
      glowing: true

# ================================================
# EJEMPLO 6: WHEEL OF FORTUNE (Ruleta)
# ================================================

wheel:
  title: '&6&l🎰 RULETA DE LA SUERTE'
  type: SIMPLE
  size: 54

  refresh:
    mode: SMART
    interval: 2  # Actualiza cada 0.1s para animación

  items:
    # Items de la ruleta (animación)
    slot_0:
      material: DIAMOND
      name: '&b&l💎 DIAMANTE'
      slot: 10
      dynamic_update: true
      glowing: true

    slot_1:
      material: EMERALD
      name: '&a&l⚜ ESMERALDA'
      slot: 11
      dynamic_update: true

    slot_2:
      material: GOLD_INGOT
      name: '&6&l⭐ ORO'
      slot: 12
      dynamic_update: true

    slot_3:
      material: IRON_INGOT
      name: '&7&l⚙ HIERRO'
      slot: 13
      dynamic_update: true

    slot_4:
      material: COAL
      name: '&8&l◆ CARBÓN'
      slot: 14
      dynamic_update: true

    # Selector (indica posición actual)
    selector:
      material: NETHER_STAR
      name: '&e&l▼'
      slot: 4
      glowing: true

    # Botón girar
    spin:
      material: SUNFLOWER
      name: '&6&l🎲 GIRAR'
      lore:
        - '&7Costo: &e100 monedas'
        - ''
        - '&e▸ Click para girar'
      slot: 49
      glowing: true
      actions:
        - 'message: &e¡Girando...'
        - 'sound: BLOCK_NOTE_BLOCK_PLING'
        # Aquí iniciar animación

# ================================================
# EJEMPLO 7: SISTEMA DE VOTACIÓN
# ================================================

vote_system:
  title: '&6Votación: ¿Nueva Arena?'
  type: SIMPLE
  size: 27

  items:
    question:
      material: PAPER
      name: '&e&l¿Agregar nueva arena de PvP?'
      lore:
        - '&7Votos a favor: &a{votes_yes}'
        - '&7Votos en contra: &c{votes_no}'
        - ''
        - '&7Total: &e{votes_total}'
        - ''
        - '&7Tiempo restante: &e{time_left}'
      slot: 4
      dynamic_update: true
      update_interval: 20

    # Barra de progreso visual
    progress_yes:
      material: LIME_STAINED_GLASS_PANE
      name: '&a{votes_yes} votos'
      slots: [10, 11, 12]  # Se actualizaría según votos
      dynamic_update: true

    progress_no:
      material: RED_STAINED_GLASS_PANE
      name: '&c{votes_no} votos'
      slots: [14, 15, 16]
      dynamic_update: true

    # Botón SÍ
    vote_yes:
      material: LIME_WOOL
      name: '&a&l✓ VOTAR SÍ'
      lore:
        - '&7Vota a favor de la propuesta'
        - ''
        - '&aA favor: {votes_yes}'
      slot: 11
      actions:
        - 'message: &a¡Votaste SÍ!'
        - 'sound: ENTITY_EXPERIENCE_ORB_PICKUP'

    # Botón NO
    vote_no:
      material: RED_WOOL
      name: '&c&l✗ VOTAR NO'
      lore:
        - '&7Vota en contra de la propuesta'
        - ''
        - '&cEn contra: {votes_no}'
      slot: 15
      actions:
        - 'message: &c¡Votaste NO!'
        - 'sound: BLOCK_NOTE_BLOCK_BASS'

