    progress_1:
      material: LIME_STAINED_GLASS_PANE
      name: '&a▓'
      slot: 11
      dynamic_update: true

    progress_2:
      material: LIME_STAINED_GLASS_PANE
      name: '&a▓'
      slot: 12
      dynamic_update: true

    progress_3:
      material: GRAY_STAINED_GLASS_PANE
      name: '&7░'
      slot: 13
      dynamic_update: true

    progress_4:
      material: GRAY_STAINED_GLASS_PANE
      name: '&7░'
      slot: 14
      dynamic_update: true

    progress_5:
      material: GRAY_STAINED_GLASS_PANE
      name: '&7░'
