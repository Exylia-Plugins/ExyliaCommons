creators:
  title: "{primary}&lLUNARIS CREATORS &8%current_page%/%total_pages%"
  size: 36
  type: PAGINATION
  #refresh:
  #  mode: SMART
  #  interval: 20

  open_sounds:
    - "ENTITY_ARROW_SHOOT|1.0|2.0"
  close_sounds:
    - "BLOCK_CHEST_LOCKED|1.0|2.0"
  click_sounds:
    - "UI_BUTTON_CLICK|1.0|2.0"

  filler:
    global:
      material: GRAY_STAINED_GLASS_PANE
      hide_tooltip: true

    pagination:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      name: '{error_light}Slot vacío'
      lore:
        - '{error}No hay más items aquí'
      hide_tooltip: false

  pagination:
    slots: '10-16,19-25'
    items:
      creator:
        material: "%creator_material%"
        name: "%creator_display_name%"
        lore:
          - '{info}Lore global'
          - ''
          - '%creator_lore%'
          - ''
          - '{info}Vota por mi!'
        actions:
          - 'vote'

    navigation:
      previous:
        slot: 48
        material: ARROW
        name: '{error}&l← PÁGINA ANTERIOR'
        lore:
          - ' {muted}❙ {letters}Haz click para ir'
          - ' {muted}❙ {letters}a la página anterior.'
          - ''
          - '{info}ℹ Página actual: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'previous_page'
      next:
        slot: 50
        material: ARROW
        name: '{success}&lPÁGINA SIGUIENTE →'
        lore:
          - ' {muted}❙ {letters}Haz click para ir'
          - ' {muted}❙ {letters}a la siguiente página.'
          - ''
          - '{info}ℹ Página actual: {success}%current_page%&8/{error}%total_pages%'
        actions:
          - 'next_page'


  items: [ ]