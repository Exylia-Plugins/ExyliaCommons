# ==================================================
# VENTAJAS DE CUSTOM FILLERS
# ==================================================
# 1. NO necesitas crear items separados para patrones
# 2. TODO está en la sección 'filler'
# 3. Más organizado y fácil de mantener
# 4. Slots soportan rangos: '10-16,19-25'
# 5. Slots soportan listas: [0, 8, 45, 53]
# 6. hide_tooltip: true oculta el tooltip (requiere MC 1.20.5+)
#
# NOTA: hide_tooltip requiere Minecraft 1.20.5 o superior.
# Si usas versiones anteriores, el campo será ignorado.
#
# ANTES (sin custom fillers):
# items:
#   diagonal1: { material: RED, slots: [0,10,20,30] }
#   diagonal2: { material: BLUE, slots: [8,16,24,32] }
#   border1: { material: GREEN, slots: '0-8' }
#
# AHORA (con custom fillers):
# filler:
#   custom:
#     diagonal1: { material: RED, slots: [0,10,20,30], hide_tooltip: true }
#     diagonal2: { material: BLUE, slots: [8,16,24,32], hide_tooltip: true }
#     border1: { material: GREEN, slots: '0-8', hide_tooltip: true }
#
# ==================================================
# EJEMPLO 8: PAGINATION FILLER
# ==================================================

pagination_filler_menu:
  title: '&6&lShop &8| &ePage %current_page%/%total_pages%'
  type: PAGINATION
  size: 54

  filler:
    # Relleno global para todos los slots vacíos
    global:
      material: GRAY_STAINED_GLASS_PANE
      name: ' '
      hide_tooltip: true

    # Relleno específico para slots de paginación vacíos
    # Se aplica SOLO cuando una página no tiene suficientes items
    pagination:
      material: BLACK_STAINED_GLASS_PANE
      name: '&7Slot vacío'
      lore:
        - '&8No hay más items aquí'
      hide_tooltip: false

  pagination:
    slots: '10-16,19-25,28-34'  # 21 slots
    items: []  # Se llenarán dinámicamente
    navigation:
      previous:
        slot: 48
        material: ARROW
        name: '&e← Anterior'
      next:
        slot: 50
        material: ARROW
        name: '&eSiguiente →'

# ==================================================
# USO DEL PAGINATION FILLER
# ==================================================
# Si tienes 21 slots de paginación pero solo 15 items:
# - Los primeros 15 slots tendrán los items
# - Los últimos 6 slots tendrán el pagination filler
#
# Sin pagination filler: usaría el global filler
# Con pagination filler: usa el filler específico
#
# Esto te permite diferenciar visualmente los slots vacíos
# de paginación de otros slots vacíos del menú

# ==================================================
# ORDEN DE APLICACIÓN
# ==================================================
# 1. global (rellena todos los slots vacíos)
# 2. border (sobrescribe bordes)
# 3. pagination (sobrescribe slots de paginación vacíos, solo en PAGINATION menus)
# 4. custom (sobrescribe slots específicos)
# 5. items (sobrescribe todo lo anterior)
#
# Esto significa que los items siempre tienen prioridad
# sobre los fillers, así que puedes usar fillers para
# decoración y luego poner items funcionales encima.

# ==================================================
# SINTAXIS DE SLOTS
# ==================================================
# Rangos:
#   slots: '10-16'        → slots 10, 11, 12, 13, 14, 15, 16
#   slots: '0-8,45-53'    → primera y última fila
#
# Listas:
#   slots: [0, 8, 45, 53] → 4 esquinas
#   slots: [4, 13, 22]    → columna central
#
# Mixto:
#   slots: '10-16,19-25,28-34'  → 3 filas de 7
