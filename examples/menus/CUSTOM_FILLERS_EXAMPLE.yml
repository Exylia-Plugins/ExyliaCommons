# ================================================
# EJEMPLO 1: PATRÓN DE BORDES DOBLES
# ================================================

double_border_menu:
  title: '&6&lMenú con Bordes Dobles'
  type: SIMPLE
  size: 54

  filler:
    # Global: Rellena todo
    global:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
      hide_tooltip: true

    # Custom: Patrones personalizados
    custom:
      # Borde exterior (primera y última fila completas)
      outer_border:
        material: RED_STAINED_GLASS_PANE
        name: ' '
        glowing: true
        hide_tooltip: true
        slots: '0-8,45-53'  # Filas superior e inferior

      # Columnas laterales
      side_columns:
        material: ORANGE_STAINED_GLASS_PANE
        name: ' '
        hide_tooltip: true
        slots: '9,17,18,26,27,35,36,44'  # Columnas izquierda y derecha

      # Borde interior
      inner_border:
        material: YELLOW_STAINED_GLASS_PANE
        name: ' '
        hide_tooltip: true
        slots: '10-16,19,25,28,34,37-43'  # Marco interior

  items:
    center:
      material: NETHER_STAR
      name: '&e&lCENTRO'
      lore:
        - '&7Rodeado de múltiples bordes'
        - '&7creados con custom fillers'
      slot: 22
      glowing: true

