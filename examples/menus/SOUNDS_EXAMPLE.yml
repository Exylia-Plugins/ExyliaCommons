      click_sounds:
        - 'BLOCK_NOTE_BLOCK_HARP:1.0:0.56'  # Re

    note_e:
      material: NOTE_BLOCK
      name: '&e&lMi'
      slot: 12
      click_sounds:
        - 'BLOCK_NOTE_BLOCK_HARP:1.0:0.63'  # Mi

    note_f:
      material: NOTE_BLOCK
      name: '&e&lFa'
      slot: 13
      click_sounds:
        - 'BLOCK_NOTE_BLOCK_HARP:1.0:0.67'  # Fa

    note_g:
      material: NOTE_BLOCK
      name: '&e&lSol'
      slot: 14
      click_sounds:
        - 'BLOCK_NOTE_BLOCK_HARP:1.0:0.75'  # Sol

    note_a:
      material: NOTE_BLOCK
      name: '&e&lLa'
      slot: 15
      click_sounds:
        - 'BLOCK_NOTE_BLOCK_HARP:1.0:0.84'  # La

    note_b:
      material: NOTE_BLOCK
      name: '&e&lSi'
      slot: 16
      click_sounds:
        - 'BLOCK_NOTE_BLOCK_HARP:1.0:0.94'  # Si

# ================================================
# EJEMPLO 3: MENÚ DE CONFIRMACIÓN CON SONIDOS
# ================================================

confirmation_with_sounds:
  title: '&c&l⚠ CONFIRMAR ACCIÓN'
  type: SIMPLE
  size: 27

  open_sounds:
    - 'ENTITY_EXPERIENCE_ORB_PICKUP:1.0:0.5'
    - 'BLOCK_NOTE_BLOCK_BASS:1.0:0.8'

  close_sounds:
    - 'BLOCK_CHEST_CLOSE'

  # No tiene click_sounds global, cada item tiene el suyo

  items:
    warning:
      material: TNT
      name: '&c&l⚠ ADVERTENCIA'
      lore:
        - '&7Esta acción es irreversible'
        - '&7¿Estás seguro?'
      slot: 13
      glowing: true

    confirm:
      material: LIME_WOOL
      name: '&a&l✓ CONFIRMAR'
      lore:
        - '&7Click para confirmar'
      slots: [11, 12]
      actions:
        - 'message: &a¡Acción confirmada!'
        - 'close'
      click_sounds:
        - 'ENTITY_PLAYER_LEVELUP:1.0:1.0'
        - 'BLOCK_NOTE_BLOCK_PLING:1.0:2.0'

    cancel:
      material: RED_WOOL
      name: '&c&l✗ CANCELAR'
      lore:
        - '&7Click para cancelar'
      slots: [14, 15]
      actions:
        - 'message: &cAcción cancelada'
        - 'back'
      click_sounds:
        - 'BLOCK_NOTE_BLOCK_BASS:1.0:0.5'
        - 'ENTITY_VILLAGER_NO:0.8:1.0'

# ================================================
# EJEMPLO 4: TIENDA CON FEEDBACK SONORO
# ================================================

shop_with_sounds:
  title: '&6&lTienda'
  type: SIMPLE
  size: 27

  open_sounds:
    - 'ENTITY_VILLAGER_YES:1.0:1.0'

  close_sounds:
    - 'ENTITY_VILLAGER_NO:0.8:1.0'

  # Sonido por defecto para items sin sonido específico
  click_sounds:
    - 'ENTITY_EXPERIENCE_ORB_PICKUP:0.5:1.0'

  items:
    # Items con sonidos de compra exitosa
    diamond:
      material: DIAMOND
      name: '&bDiamante'
      lore:
        - '&7Precio: &a$500'
        - ''
        - '&e▸ Click para comprar'
      slot: 10
      actions:
        - 'command: eco take %player_name% 500'
        - 'command: give %player_name% diamond 1'
        - 'message: &a¡Compra exitosa!'
      click_sounds:
        - 'ENTITY_PLAYER_LEVELUP:1.0:1.0'
        - 'BLOCK_NOTE_BLOCK_PLING:1.0:1.5'

    # Item sin stock (sonido de error)
    out_of_stock:
      material: BARRIER
      name: '&cAgotado'
      lore:
        - '&7Este item está agotado'
      slot: 12
      actions:
        - 'message: &c¡Item agotado!'
      click_sounds:
        - 'ENTITY_VILLAGER_NO:1.0:1.0'
        - 'BLOCK_ANVIL_LAND:0.5:2.0'

    # Item que usa el sonido global del menú
    common_item:
      material: COAL
      name: '&8Carbón'
      lore:
        - '&7Precio: &a$10'
        - ''
        - '&7Usa sonido global del menú'
      slot: 14
      actions:
        - 'command: eco take %player_name% 10'
        - 'command: give %player_name% coal 1'

# ==================================================
# FORMATO DE SONIDOS
# ==================================================
# Hay 3 formatos soportados:
#
# 1. SIMPLE (solo el nombre):
#    - 'ENTITY_PLAYER_LEVELUP'
#
# 2. CON VOLUMEN Y PITCH:
#    - 'ENTITY_PLAYER_LEVELUP:1.0:1.0'
#    - 'BLOCK_NOTE_BLOCK_PLING:0.5:2.0'
#    Formato: 'SOUND:volumen:pitch'
#    - Volumen: 0.0 - 1.0 (más alto = más lejos se escucha)
#    - Pitch: 0.5 - 2.0 (1.0 = normal, más alto = más agudo)
#
# 3. MÚLTIPLES SONIDOS:
#    click_sounds:
#      - 'ENTITY_PLAYER_LEVELUP:1.0:1.0'
#      - 'BLOCK_NOTE_BLOCK_PLING:1.0:1.5'
#      - 'ENTITY_EXPERIENCE_ORB_PICKUP:0.5:1.0'
#
# ==================================================
# LISTA DE SONIDOS COMUNES
# ==================================================
# UI/Menú:
#   - UI_BUTTON_CLICK
#   - BLOCK_CHEST_OPEN/CLOSE
#   - BLOCK_ENDER_CHEST_OPEN/CLOSE
#   - ITEM_BOOK_PAGE_TURN
#
# Feedback Positivo:
#   - ENTITY_PLAYER_LEVELUP
#   - ENTITY_EXPERIENCE_ORB_PICKUP
#   - ENTITY_VILLAGER_YES
#   - BLOCK_NOTE_BLOCK_PLING
#
# Feedback Negativo:
#   - ENTITY_VILLAGER_NO
#   - BLOCK_ANVIL_LAND
#   - ENTITY_ENDERMAN_TELEPORT
#   - BLOCK_GLASS_BREAK
#
# Musicales:
#   - BLOCK_NOTE_BLOCK_HARP
#   - BLOCK_NOTE_BLOCK_BASS
#   - BLOCK_NOTE_BLOCK_PLING
#   - BLOCK_NOTE_BLOCK_BELL
#
# Lista completa: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/Sound.html

# ==================================================
# PRIORIDAD DE SONIDOS
# ==================================================
# 1. click_sounds del ITEM (si existe)
# 2. click_sounds del MENÚ (si el item no tiene)
# 3. Ningún sonido (si ni el item ni el menú tienen)
#
# EJEMPLO:
# Menu con click_sounds: 'UI_BUTTON_CLICK'
#   Item A sin click_sounds → reproduce UI_BUTTON_CLICK
#   Item B con click_sounds: 'PLING' → reproduce PLING
#   Item C sin click_sounds → reproduce UI_BUTTON_CLICK
