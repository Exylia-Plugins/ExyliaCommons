# ==================================================
# EJEMPLO: SISTEMA DE SONIDOS EN MENÚS
# ==================================================
# Demuestra el uso de sonidos a nivel de menú y de item
# ==================================================

# ================================================
# EJEMPLO 1: SONIDOS GLOBALES DEL MENÚ
# ================================================

menu_with_global_sounds:
  title: '&6&lMenú con Sonidos Globales'
  type: SIMPLE
  size: 27

  # SONIDOS DEL MENÚ: Se aplican a todos los items sin click_sounds
  open_sounds:
    - 'BLOCK_CHEST_OPEN'
    - 'ENTITY_EXPERIENCE_ORB_PICKUP'

  close_sounds:
    - 'BLOCK_CHEST_CLOSE'

  click_sounds:
    - 'UI_BUTTON_CLICK'  # Se reproduce si el item NO tiene click_sounds

  items:
    # Item 1: Usa click_sounds del menú
    option1:
      material: DIAMOND
      name: '&bOpción 1'
      lore:
        - '&7No tiene click_sounds'
        - '&7Usará el del menú (UI_BUTTON_CLICK)'
      slot: 10
      actions:
        - 'message: &aOpción 1 seleccionada'

    # Item 2: Tiene sus propios click_sounds (sobrescribe el del menú)
    option2:
      material: EMERALD
      name: '&aOpción 2'
      lore:
        - '&7Tiene click_sounds propio'
        - '&7NO usará el del menú'
      slot: 12
      actions:
        - 'message: &aOpción 2 seleccionada'
      click_sounds:
        - 'BLOCK_NOTE_BLOCK_PLING'
        - 'ENTITY_PLAYER_LEVELUP'

    # Item 3: Sin sonido (ni del menú ni propio)
    option3:
      material: GOLD_INGOT
      name: '&6Opción 3'
      lore:
        - '&7Sin click_sounds'
        - '&7Pero usará el del menú'
      slot: 14
      actions:
        - 'message: &aOpción 3 seleccionada'

    close:
      material: BARRIER
      name: '&c&lCerrar'
      slot: 22
      actions:
        - 'close'
      click_sounds:
        - 'BLOCK_ANVIL_LAND'  # Sonido específico al cerrar

# ================================================
# EJEMPLO 2: MENÚ DE SONIDOS TEMÁTICO
