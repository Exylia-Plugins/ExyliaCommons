title: "{primary}&lEXYLIA PRACTICE BOT"
type: SIMPLE
size: 54  # 9, 18, 27, 36, 45, 54
animation: "spiral_out"

refresh:
  mode: SMART  # DISABLED | FULL | SMART | SLOT_ONLY | ON_CLICK
    # DISABLED: No actualiza
    # FULL: Refresca todo el inventario
    # SMART: Solo items con placeholders/dinámicos
  # SLOT_ONLY: Como SMART pero sin actualizar título
  interval: 20

