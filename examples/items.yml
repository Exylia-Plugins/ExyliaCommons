# ══════════════════════════════════════════════════════════════════════════════
# CLICK TYPES DISPONIBLES
# ══════════════════════════════════════════════════════════════════════════════
#
# left:        Click izquierdo normal
# right:       Click derecho normal
# middle:      Click con rueda del mouse
# shift_left:  Shift + Click izquierdo
# shift_right: Shift + Click derecho
# drop:        Tecla Q (soltar item)
# swap:        Tecla F (cambiar a mano secundaria)
# double:      Doble click
# number_key:  Teclas numéricas 1-9
# any:         Cualquier tipo de click
#
# Combinaciones: "left,right,middle: action_name"
#
# ══════════════════════════════════════════════════════════════════════════════


# ══════════════════════════════════════════════════════════════════════════════
# FORMATOS DE COMANDOS
# ══════════════════════════════════════════════════════════════════════════════
#
# player:        Ejecuta como el jugador
# console:       Ejecuta desde consola
# player-proxy:  Ejecuta como jugador en el proxy (BungeeCord/Velocity)
# console-proxy: Ejecuta desde consola del proxy
#
# Formato completo: "click_type: command_type: comando"
# Ejemplo: "left: console: give {player} diamond 1"
#
# Placeholders: {player}, {player_uuid}, {target}, y cualquier PlaceholderAPI
#
# ══════════════════════════════════════════════════════════════════════════════
