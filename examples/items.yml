#
# Formato completo:
#   potion:
#     base_type: "STRENGTH"
#     upgraded: true
#     extended: false
#     color: "#FF0000"
#     custom_effects:
#       - type: "SPEED"
#         amplifier: "2"
#         duration: "600"
#         ambient: false
#         particles: true
#         icon: true
#       - type: "REGENERATION"
#         amplifier: "1"
#         duration: "1200"
#
# Formato simple alternativo:
#   base_potion_type: "STRONG_HEALING"
#   potion_color: "#FF0000"
#   potion_effects:
#     - type: SPEED
#       amplifier: 2
#       duration: 600
#
# ══════════════════════════════════════════════════════════════════════════════


