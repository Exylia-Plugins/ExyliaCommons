



# Core
debug: false

text:
  automatic-font: "none" # small or none
  force-in-upper-case: true

formatters:
  time:
    zero-text: "0s"
    show-milliseconds: false
    compact-mode: false
    precision: 2
    language: "en"
    force-show-zero-decimals: false
    decimal-threshold-millis: 15000
    show-decimals-under-threshold: true
  date:
    default-pattern: "dd/MM/yyyy HH:mm:ss"
    date-pattern: "dd/MM/yyyy"
    time-pattern: "HH:mm:ss"
    use-iso-default: false
  price:
    currency-symbol: "$"
    symbol-before: true
    decimal-separator: "."
    thousand-separator: ","
    decimal-places: 2
    show-decimals: true
