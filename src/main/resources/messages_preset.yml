prefix: "{primary}&lEXYLIA &8•&r"

system:
  player_not_found: "%prefix% {error}The player {info}%player%{error} could not be found."
  player_only: "%prefix% {error}This action can only be executed by a player."
  no_permission: "%prefix% {error}You do not have permission to execute this action."
  not_now: "%prefix% {error}You can't do that right now."
  specify_player: "%prefix% {error}You must specify a player when executing from console."
  invalid_range: "%prefix% {error}The quantity {info}%quantity%{error} must be between 1 and 64."
  invalid_number: "%prefix% {error}The quantity {info}%quantity%{error} is not a valid number."

  input:
    title:
      title: "{primary}Enter your input in chat."
      subtitle: "{info}%time%s remaining"

  commands:
    no_subcommands: "%prefix% {error}This command has no subcommands."
    usage: "%prefix% {primary}Usage: {info}%usage%{primary}"
    help:
      usage: "{success}/%label% {success_light}%usage%"
      header: |-
        &f
        {primary}%plugin_name% &8&l•&r {secondary}Command help
        &f
        {warning}<> &8&l•&r {warning_light}Required &8| {info}[] &8&l•&r {info_light}Optional
        &f
    reload:
      starting: "%prefix% {info}ℹ Reloading..."
      success: "%prefix% {success}✓ Plugin reloaded successfully in {info}%time%ms{success}."
      error: "%prefix% {error}✘ Reload error: %error%"

  items:
    no_uses_remaining: "%prefix% {error}The item has no uses remaining."
    consumed: "%prefix% {warning}The item has been consumed."
    region_denied: "%prefix% {error}You are not allowed to use this item in this region."
    in_cooldown: "%prefix% {warning}This item is in cooldown, please wait {info}%cooldown_formatted%{warning} to use it again."
    global_cooldown: "%prefix% {warning}You have a global cooldown active, please wait {info}%cooldown_formatted%{warning} before using any item."
    vanilla_cooldown: "%prefix% {warning}This item is in cooldown, please wait {info}%cooldown_formatted%{warning} to use it again." # %item%
    vanilla_region_blocked: "%prefix% {error}You are not allowed to use this item in {info}%region%{error}."
    vanilla_region_limit: "%prefix% {error}You have reached the maximum uses for this item in {info}%region%{error}."